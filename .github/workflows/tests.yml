# Tests of the hive's tooling. First the hive protocol's (docs/protocol.md): tools/hive/test_hive.py, test_schedule.py,
# test_page.py and test_artifact.py, on local git repositories and archives the tests make, without network. Then the
# judges' (tools/judge/): the common judge's unit tests and meta-tests against the honest toy project and its malicious
# variants (test_judge.py), and the judge's second kind on its own toy project, alone and through the hive's own judging
# (test_reference.py). The variants' code runs only in the judge's containers (without network, read-only).
# Read-only: no secret, no write, nothing of a pull request runs with more than a read token.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Hive protocol tests (standard library only)
        run: python3 tools/hive/test_hive.py
      - name: What holds over many runs (schedules drawn at random)
        run: python3 tools/hive/test_schedule.py
      - name: The project page (what the public reads)
        run: python3 tools/hive/test_page.py
      - name: What a job takes from an earlier job's archive
        run: python3 tools/hive/test_artifact.py
      - name: The common judge, its unit tests and meta-tests
        env:
          BEE_JUGE_INTEGRATION: "1"
        run: python3 tools/judge/test_judge.py
      - name: The second kind (reference), its unit tests and meta-tests on its own toy project
        env:
          BEE_JUGE_INTEGRATION: "1"
        run: python3 tools/judge/test_reference.py
