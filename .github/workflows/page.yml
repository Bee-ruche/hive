# The public page of one hive project, made again after each run (docs/hosting.md, "The project's page, after each
# run"). A reusable workflow, and nothing else: a project that wants its page calls it from its own workflow, as a job
# after the hive's run, at the same commit (examples/page/.github/workflows/hive.yml), and sets its repository's Pages
# source to GitHub Actions once. Two jobs. build reads the project's branch hive-state and two files of its published
# branch, makes the page with tools/hive/page.py at this workflow's own commit of Bee-ruche/hive, and uploads it; its
# token reads, and is written nowhere. deploy hands that upload to GitHub Pages: it alone may deploy, and it runs none
# of the hive's code and reads no file. Neither job writes a branch, and nothing of a fork or a candidate is fetched:
# the page is made from the hive's own state, which page.py reads as data. tools/hive/test_page.py
# (TestThePageWorkflow) holds this file word for word: whoever changes a line here changes that test in the same
# commit, in sight of a reviewer.
name: Hive page
on:
  workflow_call:
    inputs:
      title:
        type: string
        default: ""
      site_url:
        type: string
        default: ""
permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: This workflow's own repository and commit, on Bee-ruche/hive's main (the hive's code runs from there)
        id: protocol
        env:
          REPOSITORY: ${{ job.workflow_repository }}
          COMMIT: ${{ job.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "${REPOSITORY,,}" == bee-ruche/hive && "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "this workflow is not Bee-ruche/hive's at a full commit: nothing runs" >&2; exit 1; }
          state="$(timeout 60 gh api "repos/Bee-ruche/hive/compare/main...$COMMIT" --jq .status)" || state="API error or timeout"
          [[ "$state" == identical || "$state" == behind ]] || { echo "this workflow's commit $COMMIT is not on Bee-ruche/hive's main ($state): nothing runs" >&2; exit 1; }
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Bee-ruche/hive
          ref: ${{ steps.protocol.outputs.commit }}
          path: protocol
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: hive-state
          path: state
          persist-credentials: false
      - name: The project's tasks and settings, as its published branch holds them (two files, written as data; no tree is checked out)
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          git clone --quiet --depth 1 --no-checkout "https://github.com/$REPOSITORY" project
          mkdir published
          git -C project show HEAD:hive/tasks.jsonl > published/tasks.jsonl
          git -C project show HEAD:hive/project.json > published/project.json
      - name: The page, from the state (page.py reads every file of it as data), into a folder of its own, packed for Pages
        env:
          REPOSITORY: ${{ github.repository }}
          TITLE: ${{ inputs.title }}
          SITE_URL: ${{ inputs.site_url }}
        run: |
          site=()
          [[ -z "$SITE_URL" ]] || site=("--site-url=$SITE_URL")
          python3 protocol/tools/hive/page.py --state state --out page "--title=$TITLE" --repo-url "https://github.com/$REPOSITORY" \
            --tasks published/tasks.jsonl --project published/project.json "${site[@]}"
          tar --create --file artifact.tar --directory page .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: artifact.tar
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
