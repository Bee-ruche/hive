# The public page of one hive project, made again after each run (docs/hosting.md, "The project's page, after each
# run"). A reusable workflow, and nothing else: a project that wants its page calls it from its own workflow, as a job
# after the hive's run, at the same commit (examples/page/.github/workflows/hive.yml), and sets its repository's Pages
# source to GitHub Actions once. Two jobs. build checks that the repository's Pages take the site from a workflow,
# reads the project's branch hive-state, two files of its published branch and its backlog when it holds one (each
# held to its size), and the list of the project's branches (for the forecast: the commit of the branch the hive
# writes), makes the page with tools/hive/page.py at this workflow's own commit of Bee-ruche/hive, holds it to plain
# files and folders, and
# uploads it; its token reads, and is written nowhere. deploy hands that upload to GitHub Pages, one deploy at a time:
# it alone may deploy, and it runs none of the hive's code and reads no file. Neither job writes a branch, and nothing
# of a fork or a candidate is fetched: the page is made from the hive's own state, which page.py reads as data.
# tools/hive/test_page.py (TestThePageWorkflow) holds this file word for word: whoever changes a line here changes
# that test in the same commit, in sight of a reviewer.
name: Hive page
on:
  workflow_call:
    inputs:
      title:
        type: string
        default: ""
      site_url:
        type: string
        default: ""
permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: This workflow's own repository and commit, on Bee-ruche/hive's main (the hive's code runs from there)
        id: protocol
        env:
          REPOSITORY: ${{ job.workflow_repository }}
          COMMIT: ${{ job.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "${REPOSITORY,,}" == bee-ruche/hive && "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "this workflow is not Bee-ruche/hive's at a full commit: nothing runs" >&2; exit 1; }
          state="$(timeout 60 gh api "repos/Bee-ruche/hive/compare/main...$COMMIT" --jq .status)" || state="API error or timeout"
          [[ "$state" == identical || "$state" == behind ]] || { echo "this workflow's commit $COMMIT is not on Bee-ruche/hive's main ($state): nothing runs" >&2; exit 1; }
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Bee-ruche/hive
          ref: ${{ steps.protocol.outputs.commit }}
          path: protocol
          persist-credentials: false
      - name: The repository's GitHub Pages take the site from a workflow (Settings, Pages, Source GitHub Actions), or nothing is made
        env:
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          source="$(timeout 60 gh api "repos/$REPOSITORY/pages" --jq .build_type)" || source="no Pages site, or no answer"
          [[ "$source" == workflow ]] || { echo "page: this repository's GitHub Pages do not take the site from a workflow ($source): in Settings, Pages, choose the source GitHub Actions (docs/hosting.md of Bee-ruche/hive, \"The project's page, after each run\"); nothing is made" >&2; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: hive-state
          path: state
          persist-credentials: false
      - name: The project's tasks, settings and backlog, as its published branch holds them (each file held to its size and written as data; no tree is checked out), and the list of its branches
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          git clone --quiet --depth 1 --no-checkout "https://github.com/$REPOSITORY" project
          mkdir published
          for file in tasks.jsonl:16777216 project.json:1048576; do
            name="${file%%:*}" most="${file##*:}"
            read -r mode type object path <<< "$(git -C project ls-tree HEAD -- "hive/$name")"
            [[ "$mode" =~ ^100(644|755)$ && "$type" == blob && "$path" == "hive/$name" ]] || { echo "page: hive/$name is not a file of the published branch: nothing is made" >&2; exit 1; }
            size="$(git -C project cat-file -s "$object")"
            [[ "$size" =~ ^[0-9]+$ ]] && (( size <= most )) || { echo "page: hive/$name of the published branch is larger than $most bytes: nothing is made" >&2; exit 1; }
            git -C project cat-file blob "$object" > "published/$name"
          done
          listed="$(git -C project ls-tree HEAD -- hive/backlog.jsonl)" || listed="unlisted"
          if [[ -n "$listed" ]]; then
            read -r mode type object path <<< "$listed"
            [[ "$mode" =~ ^100(644|755)$ && "$type" == blob && "$path" == hive/backlog.jsonl ]] && size="$(git -C project cat-file -s "$object")" || size=""
            if [[ "$size" =~ ^[0-9]+$ ]] && (( size <= 16777216 )) && git -C project cat-file blob "$object" > published/backlog.part; then
              mv published/backlog.part published/backlog.jsonl
            else
              rm -f published/backlog.part
              echo "page: hive/backlog.jsonl is not a file of the published branch of at most 16777216 bytes: the forecast goes without it" >&2
            fi
          else
            : > published/backlog.jsonl  # (no backlog: an empty one, as the hive reads a branch that holds none)
          fi
          { timeout 60 git -C project ls-remote --heads origin || echo "page: the project's branches could not be listed whole: the forecast may go without the branch the hive writes" >&2; } | head -c 1048576 > published/heads.txt || true
      - name: The page, from the state (page.py reads every file of it as data), into a folder of its own, packed for Pages
        env:
          REPOSITORY: ${{ github.repository }}
          TITLE: ${{ inputs.title }}
          SITE_URL: ${{ inputs.site_url }}
        run: |
          site=() backlog=()
          [[ -z "$SITE_URL" ]] || site=("--site-url=$SITE_URL")
          [[ ! -f published/backlog.jsonl ]] || backlog=(--backlog published/backlog.jsonl)
          python3 protocol/tools/hive/page.py --state state --out page "--title=$TITLE" --repo-url "https://github.com/$REPOSITORY" \
            --tasks published/tasks.jsonl --project published/project.json --heads published/heads.txt "${backlog[@]}" "${site[@]}"
          odd="$(find page -mindepth 1 \( \( ! -type f ! -type d \) -o \( -type f -links +1 \) \) -print -quit)"
          [[ -z "$odd" ]] || { echo "page: the page's folder holds a link or a file of several names ($odd): nothing is packed" >&2; exit 1; }
          tar --create --file artifact.tar --directory page .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: artifact.tar
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment: github-pages
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
